<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Art Preference Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <h1>Which painting do you prefer?</h1>
        <p>
            Look closely. There is no right or wrong answer.
        </p>
        <div class="pair">
            <section class="painting-card">
                <h2>Painting A</h2>
                <img src="img/76938.jpg" alt="Painting A for comparison">
                <button>Choose A</button>
            </section>
            <section class="painting-card">
                <h2>Painting B</h2>
                <img src="img/436940.jpg" alt="Painting B for comparison">
                <button>Choose B</button>
            </section>
        </div>
        <footer>
            <p>Images: The Metropolitan Museum of Art, Open Access.</p>
        </footer>
    </main>

</body>

</html>
